<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/dist/WhatsApp Image 2026-10-12 at 5.23.08 AM.jpeg" />
  <link rel="apple-touch-icon" href="/dist/WhatsApp Image 2026-10-12 at 5.23.08 AM.jpeg" />
  <meta name="theme-color" content="#000000" />
  <title>PrintopiaPK — Bespoke Printing, Packaging & Event Essentials</title>
  <meta name="description"
    content="Pakistan's premium bespoke printing and packaging studio. Signature Hajj & Umrah tabarruk boxes, luxury wedding bid favors, die-cut logo stickers, and corporate merchandise." />
  <meta name="keywords"
    content="PrintopiaPK, custom boxes, wedding bid boxes, Hajj Umrah tabarruk, custom printing, die cut stickers" />
  <meta name="robots" content="index, follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('theme_mode') || localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.style.colorScheme = savedTheme;
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark-mode');
          document.documentElement.classList.add('light-mode');
        } else {
          document.documentElement.classList.remove('light-mode');
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body class="dark-mode" data-theme="dark">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
